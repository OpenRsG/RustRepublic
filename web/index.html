<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RiderRepRust ski showcase</title>
  <style>
    html, body { margin: 0; height: 100%; background: #ececee; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #status { position: absolute; inset: 0; display: grid; place-items: center;
      font: 16px system-ui, sans-serif; color: #234; text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <canvas id="bevy" tabindex="0"></canvas>
  <div id="status">Loading…</div>
  <script type="module">
    const status = document.getElementById('status');
    if (!navigator.gpu) {
      status.textContent = 'This page needs WebGPU (recent Chrome, Edge or Safari, served over HTTPS).';
    } else {
      document.getElementById('bevy').focus();
      import('./rider-rep-rust.js')
        .then((m) => m.default())
        .catch((e) => {
          // Bevy's winit loop exits by throwing; only show real failures.
          if (!String(e).includes('Using exceptions for control flow')) {
            status.textContent = 'Failed to start: ' + e;
            throw e;
          }
        });
      new MutationObserver(() => status.remove())
        .observe(document.getElementById('bevy'), { attributes: true });
    }
  </script>
</body>
</html>

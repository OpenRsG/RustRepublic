[package]
name = "rider-rep-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "rider-rep-rust"
license = "Apache-2.0"
repository = "https://github.com/OpenRsG/RustRepublic"

[features]
default = ["game"]
game = ["dep:bevy"]

[[bin]]
name = "rider-rep-rust"
path = "src/main.rs"
required-features = ["game"]

[[bin]]
name = "rider-assets"
path = "src/bin/assets.rs"

[dependencies]
bevy = { version = "=0.17.3", optional = true, default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_audio", "bevy_color",
    "bevy_core_pipeline", "bevy_pbr", "bevy_render", "bevy_image", "bevy_mesh",
    "bevy_camera", "bevy_light", "bevy_shader", "bevy_text", "bevy_ui",
    "bevy_ui_render", "bevy_window", "bevy_winit", "bevy_log", "default_font",
    "bevy_gizmos", "tonemapping_luts", "ktx2", "zstd_rust",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = { version = "0.13", default-features = false }
bevy = { version = "=0.17.3", optional = true, default-features = false, features = ["x11", "wayland"] }

# Browser build (scripts/web.sh): WebGPU only, no WebGL fallback.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "=0.17.3", optional = true, default-features = false, features = ["web", "webgpu"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Browser bundle (scripts/web.sh): built for speed; the page downloads a gzipped copy (~8 MB).
[profile.web]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
